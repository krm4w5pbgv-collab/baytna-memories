
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f2e8d8">
  <title>ذكريات بيتنا</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f2e8d8;
      font-family: Tahoma, Arial, sans-serif;
      color: #493526;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      padding: 38px 28px;
      text-align: center;
      background: #fffaf1;
      border: 1px solid #d8c3a5;
      border-radius: 8px;
      box-shadow: 0 12px 35px #60452b18;
    }

    .house {
      font-size: 43px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 27px;
      color: #68472f;
    }

    .subtitle {
      margin-bottom: 30px;
      color: #94765c;
      font-size: 14px;
    }

    .field {
      text-align: right;
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8c3a5;
      border-radius: 5px;
      background: #fffdf8;
      color: #493526;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #96704c;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 5px;
      background: #765337;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: .85;
    }

    #message {
      min-height: 22px;
      margin-top: 16px;
      font-size: 13px;
      color: #a13b32;
    }

    .footer {
      margin-top: 25px;
      padding-top: 18px;
      border-top: 1px solid #e5d8c5;
      color: #a28a70;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <div class="house">🏠</div>

    <h1>ذكريات بيتنا</h1>
    <p class="subtitle">أهلًا بعودتك، سجّل دخولك للمتابعة</p>

    <form id="loginForm">
      <div class="field">
        <label for="username">اسم المستخدم</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="اكتب اسم المستخدم"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="اكتب كلمة المرور"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" id="loginButton">تسجيل الدخول</button>
      <p id="message" role="alert"></p>
    </form>

    <div class="footer">ذكريات تجمعنا دائمًا</div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async event => {
      event.preventDefault();

      message.textContent = "";
      button.disabled = true;
      button.textContent = "جارٍ تسجيل الدخول...";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify({
            username: form.username.value.trim(),
            password: form.password.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          message.textContent = data.error || "تعذر تسجيل الدخول.";
          return;
        }

        location.href = "/home.html";
      } catch {
        message.textContent = "تعذر الاتصال بالموقع.";
      } finally {
        button.disabled = false;
        button.textContent = "تسجيل الدخول";
      }
    });
  </script>

</body>
</html>
