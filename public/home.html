
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ذكريات بيتنا</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2e8d8;
      color: #493526;
      font-family: Tahoma, Arial, sans-serif;
    }

    header {
      background: #765337;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 23px;
      font-weight: bold;
    }

    main {
      width: min(90%, 600px);
      margin: 55px auto;
      padding: 35px 25px;
      text-align: center;
      background: #fffaf1;
      border: 1px solid #d8c3a5;
      border-radius: 8px;
      box-shadow: 0 12px 35px #60452b18;
    }

    .house { font-size: 48px; }

    h1 {
      color: #68472f;
      font-size: 27px;
    }

    .account {
      margin: 25px 0;
      padding: 20px;
      background: #f2e8d8;
      border-radius: 7px;
      line-height: 2.2;
    }

    button {
      padding: 13px 25px;
      border: 0;
      border-radius: 5px;
      background: #765337;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    #message {
      color: #a13b32;
    }
  </style>
</head>
<body>
  <header>ذكريات بيتنا 🏠</header>

  <main>
    <div class="house">🏡</div>
    <h1>أهلًا بك في ذكريات بيتنا</h1>
    <p>هذا مكان يجمع ذكرياتنا الجميلة.</p>

    <div class="account">
      <div>رقم حسابك: <strong id="accountNumber">...</strong></div>
      <div>اسم المستخدم: <strong id="accountName">...</strong></div>
    </div>

    <p id="message"></p>
    <button id="logoutButton">تسجيل الخروج</button>
  </main>

  <script>
    async function checkLogin() {
      try {
        const response = await fetch("/api/me");
        const data = await response.json();

        if (!response.ok || !data.authenticated) {
          location.replace("/");
          return;
        }

        document.getElementById("accountNumber").textContent =
          data.account.number;

        document.getElementById("accountName").textContent =
          data.account.username;
      } catch {
        location.replace("/");
      }
    }

    document.getElementById("logoutButton").addEventListener("click", async () => {
      const button = document.getElementById("logoutButton");
      button.disabled = true;

      try {
        await fetch("/api/logout", { method: "POST" });
        location.replace("/");
      } catch {
        document.getElementById("message").textContent =
          "تعذر تسجيل الخروج. حاول مرة أخرى.";
        button.disabled = false;
      }
    });

    checkLogin();
  </script>
</body>
</html>
